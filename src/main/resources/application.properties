server.port=8080
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3.5:4b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
ollama.max-attempts=${OLLAMA_MAX_ATTEMPTS:1}
fallback.openai.enabled=${AI_FALLBACK_ENABLED:true}
fallback.openai.base-url=${AI_FALLBACK_BASE_URL:https://api.openai.com/v1}
fallback.openai.api-key=${AI_FALLBACK_API_KEY:}
fallback.openai.model=${AI_FALLBACK_MODEL:gpt-4o-mini}
fallback.openai.timeout-seconds=${AI_FALLBACK_TIMEOUT_SECONDS:60}
fallback.primary-recovery-seconds=${AI_PRIMARY_RECOVERY_SECONDS:30}
agent.workspace=${AGENT_WORKSPACE:${user.dir}/agent-workspace}
spring.datasource.url=${MENTOR_DB_URL:jdbc:h2:file:${user.dir}/data/mentor-db;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen3.5:4b}
spring.ai.ollama.chat.options.temperature=0.3